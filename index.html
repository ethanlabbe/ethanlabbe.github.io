    <script>
        async function loadMarkdownContent() {
            const sections = [
                { selector: '#about-content', file: 'content/about.md' },
                { selector: '#project-robotic-inspection', file: 'content/projects/robot-inspection.md' },
                { selector: '#project-stereo-vision-system', file: 'content/projects/stereo-vision.md' },
                { selector: '#project-guitar-pedal', file: 'content/projects/guitar-pedal.md' },
                { selector: '#project-fusion-energy-fuel-research', file: 'content/projects/fusion-energy-fuel-research.md' },
                { selector: '#project-solar-pv-home-automation', file: 'content/projects/solar-pv-home-automation.md' },
                { selector: '#project-uavcm', file: 'content/projects/uavcm.md' },
                { selector: '#contact-content', file: 'content/contact.md' }
            ];

            for (const section of sections) {
                const element = document.querySelector(section.selector);
                if (!element) continue;

                try {
                    const response = await fetch(section.file);
                    if (!response.ok) throw new Error(`Unable to load ${section.file}`);
                    const markdown = await response.text();
                    element.innerHTML = renderMarkdown(markdown, section.file);
                } catch (error) {
                    console.error(error);
                    element.innerHTML = '<p>Content could not be loaded.</p>';
                }
            }
        }

        function resolveMarkdownAsset(assetPath, baseFile) {
            if (!assetPath) return '';
            if (/^(https?:)?\/\//i.test(assetPath) || assetPath.startsWith('data:')) {
                return assetPath;
            }
            return new URL(assetPath, new URL(baseFile, window.location.href)).href;
        }

        function renderMarkdown(markdown, baseFile = '') {
            const lines = markdown.trim().split(/\r?\n/);
            let html = '';
            let paragraph = [];

            function flushParagraph() {
                if (paragraph.length) {
                    html += `<p>${paragraph.join('<br>')}</p>`;
                    paragraph = [];
                }
            }

            function escapeHtml(value) {
                return value
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function formatInline(value) {
                let formatted = escapeHtml(value);
                formatted = formatted.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
                formatted = formatted.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                formatted = formatted.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                return formatted;
            }

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) {
                    flushParagraph();
                    return;
                }

                const headingMatch = trimmed.match(/^(#{1,6})\s+(.*)$/);
                if (headingMatch) {
                    flushParagraph();
                    const level = headingMatch[1].length;
                    html += `<h${level}>${formatInline(headingMatch[2])}</h${level}>`;
                    return;
                }

                const imageMatch = trimmed.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
                if (imageMatch) {
                    flushParagraph();
                    const imageSrc = resolveMarkdownAsset(imageMatch[2], baseFile);
                    html += `<img src="${imageSrc}" alt="${imageMatch[1] || ''}" class="project-image">`;
                    return;
                }

                paragraph.push(formatInline(trimmed));
            });

            flushParagraph();
            return html;
        }

        async function copyEmailToClipboard(email) {
            if (!email) return false;

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(email);
                    return true;
                }

                const textArea = document.createElement('textarea');
                textArea.value = email;
                textArea.setAttribute('readonly', '');
                textArea.style.position = 'fixed';
                textArea.style.top = '-9999px';
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                return true;
            } catch (error) {
                console.error('Copy failed:', error);
                return false;
            }
        }

        function bindCopyEmail() {
            const emailButtons = document.querySelectorAll('.copy-email');

            emailButtons.forEach((button) => {
                button.addEventListener('click', async (event) => {
                    event.preventDefault();
                    const email = button.dataset.email || button.textContent.trim();
                    const copied = await copyEmailToClipboard(email);

                    if (copied) {
                        const originalText = button.textContent.trim();
                        button.classList.add('copied');
                        button.textContent = 'Email copied!';
                        setTimeout(() => {
                            button.textContent = originalText;
                            button.classList.remove('copied');
                        }, 1200);
                    }
                });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            function showView() {
                const about = ['#about', '#contact'].includes(window.location.hash);
                document.querySelector('#about').hidden = !about;
                document.querySelector('#projects').hidden = about;
                document.querySelectorAll('.view-link').forEach((link) => {
                    const active = link.hash === (about ? '#about' : '#projects');
                    if (active) link.setAttribute('aria-current', 'page');
                    else link.removeAttribute('aria-current');
                });
            }
            window.addEventListener('hashchange', showView);
            showView();
            loadMarkdownContent();
            bindCopyEmail();
        });
    </script>
